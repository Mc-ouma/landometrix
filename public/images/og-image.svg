<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Brand Blue Background -->
  <rect width="1200" height="630" fill="#1D4ED8"/>
  
  <!-- Subtle Grid Accent -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B1F4B" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Monogram Logo Container (Using provided logo geometry) -->
  <g transform="translate(100, 130) scale(0.48)">
    <path d="M40 208C40 219.046 48.9543 228 60 228H198.448C209.494 228 218.448 236.954 218.448 248C218.448 259.046 209.494 268 198.448 268H20C8.95431 268 0 259.046 0 248V20C0 8.9543 8.95431 0 20 0C31.0457 0 40 8.95431 40 20V208Z" fill="#FFFFFF" opacity="0.85"/>
    <rect x="60" width="40" height="220" rx="20" fill="#FFFFFF"/>
    <path d="M138 110C149.046 110 158 118.954 158 130V200C158 211.046 149.046 220 138 220C126.954 220 118 211.046 118 200V130C118 118.954 126.954 110 138 110ZM198 0C209.046 0 218 8.95431 218 20V200C218 211.046 209.046 220 198 220C186.954 220 178 211.046 178 200V20C178 8.95431 186.954 0 198 0Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Wordmark -->
  <text x="240" y="215" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Landometrix
  </text>
  
  <!-- Pill Badge -->
  <g transform="translate(100, 310)">
    <rect width="280" height="44" rx="22" fill="#0B1F4B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="140" y="28" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1">
      DATA &amp; WEB SOLUTIONS
    </text>
  </g>
  
  <!-- Headline -->
  <text x="100" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    Turn messy data into decisive action.
  </text>
  
  <!-- Subheadline -->
  <text x="100" y="480" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="400" fill="#EFF6FF" fill-opacity="0.9">
    Data analytics, visualization, and custom web products built in Kenya for global impact.
  </text>
  
  <!-- Website URL footer -->
  <text x="100" y="550" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" fill="#38BDF8">
    landometrix.com
  </text>
</svg>
